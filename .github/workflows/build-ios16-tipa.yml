name: Build iOS 16 TrollStore JIT fix

on:
  workflow_dispatch:
  push:
    branches:
      - fix/ios16-trollstore-jit

permissions:
  contents: read
  actions: write

concurrency:
  group: husk-ios16-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Husk 3.0 vendors a Swift 6.4 StikJIT interface and uses the iOS 27 SDK.
    runs-on: xcode-27
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Stop superseded builds on this fix branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Initial runs predate the concurrency group. Cancel only older runs
          # of this same workflow and branch, never another project workflow.
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=fix%2Fios16-trollstore-jit&per_page=100" \
            --jq ".workflow_runs[] | select(.path == \".github/workflows/build-ios16-tipa.yml\" and .run_number < $GITHUB_RUN_NUMBER and (.status == \"in_progress\" or .status == \"queued\")) | .id" \
            > /tmp/husk-obsolete-runs.txt
          while read -r run_id; do
            [ -n "$run_id" ] || continue
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" || true
          done < /tmp/husk-obsolete-runs.txt
      - name: Install build tools
        run: |
          brew install meson ninja pkgconf xcodegen qemu autoconf automake libtool bison
          python3 -m venv .venv-build
          .venv-build/bin/pip install PyYAML packaging
          echo "$GITHUB_WORKSPACE/.venv-build/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/husk-rustup.sh
            sh /tmp/husk-rustup.sh -y --profile minimal
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Download official 3.0 resource donor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/donor
          gh release download 3.0 --repo Leviidev/Husk --pattern Husk.tipa --dir build/donor
      - name: Restore compiled dependencies
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/ios-arm64
            build/stamps
            third_party/build
            third_party/gpu
            guests/phase0
            src/rppairing-ios/target
          key: husk3-ios27-${{ runner.arch }}-${{ hashFiles('scripts/build_ios.sh', 'scripts/build_gpu_ios.sh', 'scripts/sources.sh', 'patches/**') }}-${{ github.run_id }}
          restore-keys: |
            husk3-ios27-${{ runner.arch }}-${{ hashFiles('scripts/build_ios.sh', 'scripts/build_gpu_ios.sh', 'scripts/sources.sh', 'patches/**') }}-
      - name: Build patched app and QEMU
        run: bash scripts/build_ios16_fixed.sh "$GITHUB_WORKSPACE/build/donor/Husk.tipa"
      - name: Save compiled dependencies for repair retries
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            build/ios-arm64
            build/stamps
            third_party/build
            third_party/gpu
            guests/phase0
            src/rppairing-ios/target
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
      - name: Upload TIPA and checksum
        uses: actions/upload-artifact@v4
        with:
          name: Husk-iOS16-JIT-fixed
          path: |
            build/Husk-iOS16-JIT-fixed.tipa
            build/Husk-iOS16-JIT-fixed.tipa.sha256
            build/ios16-donor-sha256.txt
          if-no-files-found: error
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Husk-iOS16-build-logs
          path: build/logs/
          if-no-files-found: ignore
